name: Deploy Backend Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mobilebee-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Backend
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'bash -s' <<'EOF'
            set -e

            export PATH=/www/server/nodejs/v24.20.0/bin:$PATH

            cd /www/projects/MobileBee-Backend

            git fetch origin main
            git reset --hard origin/main

            npm ci
            npm run build

            pm2 restart mobilebee-backend --update-env

            sleep 3

            curl -fsS http://127.0.0.1:3000/api/v1/health

            echo ""
            echo "Backend deployed successfully"
          EOF